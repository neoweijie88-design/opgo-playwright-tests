name: Scheduled Playwright Tests

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '30 15 * * *' # Runs every day at 11:30 PM Singapore Time (15:30 UTC)
  workflow_dispatch: # Allows you to trigger the test manually via the GitHub UI

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # --- 1. Set up and Connect to OpenVPN (Cert-Only) ---
      - name: Install and Connect OpenVPN
        env:
          OVPN_CONFIG: ${{ secrets.OVPN_CONFIG }}
        run: |
          sudo apt-get update && sudo apt-get install -y openvpn openvpn-systemd-resolved
          
          # Diagnostic check (Keeping secret value safe)
          echo "OVPN_CONFIG length: ${#OVPN_CONFIG}"
          if [ -z "$OVPN_CONFIG" ]; then
            echo "ERROR: OVPN_CONFIG secret is missing or empty in your GitHub settings!"
            exit 1
          fi

          # Write OpenVPN profile
          echo "$OVPN_CONFIG" > /tmp/client.ovpn
          
          # Start OpenVPN as a background service without credentials
          sudo openvpn --config /tmp/client.ovpn --log /tmp/openvpn.log --daemon
          
          # Wait up to 30 seconds for the connection to establish (checking tun0 interface)
          for i in {1..30}; do
            if ip addr show tun0 2>/dev/null | grep -q "inet"; then
              echo "VPN Connected successfully!"
              ip addr show tun0
              exit 0
            fi
            echo "Waiting for VPN connection... ($i/30)"
            sleep 1
          done
          
          # If it failed to connect, print the log to debug immediately
          echo "VPN Connection Failed! Showing logs below:"
          cat /tmp/openvpn.log
          exit 1

      # --- 2. Run Playwright Tests ---
      - name: Run Playwright tests
        run: npx playwright test

      # --- 3. Clean up VPN (Runs even if tests fail) ---
      - name: Disconnect OpenVPN
        if: always()
        run: |
          sudo killall openvpn || true
          rm -f /tmp/client.ovpn

      # --- 4. Upload test reports ---
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
