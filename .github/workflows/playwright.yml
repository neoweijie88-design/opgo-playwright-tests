name: Scheduled Playwright Tests

on:
  push:
    branches: [ main ]
  schedule:
    # Runs every day at 11:30 PM Singapore Time (15:30 UTC)
    # Adjust this cron expression to change the time
    - cron: '30 15 * * *'
  workflow_dispatch: # Allows you to trigger the test manually via the GitHub UI

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # --- Set up and Connect to OpenVPN ---
      - name: Install and Connect OpenVPN
        env:
          OVPN_CONFIG: ${{ secrets.OVPN_CONFIG }}
        run: |
          sudo apt-get update && sudo apt-get install -y openvpn openvpn-systemd-resolved

          # 1. Verify secrets are populated (lengths only, keeping values secret)
          echo "OVPN_CONFIG length: ${#OVPN_CONFIG}"
          echo "OVPN_USERNAME length: ${#OVPN_USERNAME}"
          if [ -z "$OVPN_CONFIG" ]; then
            echo "ERROR: OVPN_CONFIG secret is empty!"
            exit 1
          fi

          # 2. Write configuration & credentials
          printf "%s\n%s\n" "$OVPN_USERNAME" "$OVPN_PASSWORD" > /tmp/vpn-auth.txt
          chmod 600 /tmp/vpn-auth.txt
          echo "$OVPN_CONFIG" > /tmp/client.ovpn

          # 3. Start OpenVPN with output logged to /tmp/openvpn.log
          sudo openvpn --config /tmp/client.ovpn --auth-user-pass /tmp/vpn-auth.txt --log /tmp/openvpn.log --daemon

          # 4. Wait up to 30 seconds for tun0 interface
          for i in {1..30}; do
            if ip addr show tun0 2>/dev/null | grep -q "inet"; then
              echo "✅ VPN Connected successfully!"
              ip addr show tun0
              exit 0
            fi
            echo "Waiting for VPN connection... ($i/30)"
            sleep 1
          done

          # 5. Print the full log if connection failed
          echo "❌ Failed to connect to VPN. Printing OpenVPN logs:"
          cat /tmp/openvpn.log
          exit 1

      # --- 2. Run Tests ---
      - name: Run Playwright tests
        run: npx playwright test

      # --- 3. Clean up VPN (Runs even if tests fail) ---
      - name: Disconnect OpenVPN
        if: always()
        run: |
          sudo killall openvpn || true
          rm -f /tmp/client.ovpn /tmp/vpn-auth.txt

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30